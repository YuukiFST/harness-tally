[project]
name = "harness-tally"
version = "0.1.0"
description = "Measuring reverse proxy: one JSONL record per request with the gateway's own token usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
